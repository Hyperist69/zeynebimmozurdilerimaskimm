  <script>
    const questionTexts = [
      "Özür dilerim, affettin mi?",
      "Bak lütfen, gerçekten çok üzgünüm.",
      "Sensiz yapamıyorum, affet beni olur mu?",
      "Yaptığımın farkındayım, çok pişmanım.",
      "Bir şans daha ver, söz telafi edeceğim!",
      "Dünyanın en güzel insanı, affet beni 🥺",
      "Bensiz hayat daha güzel olamaz 😅",
      "Lütfen, bana küsmeyeceğini söyle.",
      "Her şeyim sensin, affet beni!",
      "Bir bakışına dünyaları değişmem.",
      "Gülüşünü bir daha kaybetmek istemiyorum!"
    ];
    let noCount = 0;
    let textIndex = 0;
    const maxNo = 10;
    const questionEl = document.getElementById("questionText");
    const hayirBtn = document.getElementById("hayirBtn");
    const evetBtn = document.getElementById("evetBtn");
    const gifBox = document.getElementById("gifBox");
    const btnRow = document.getElementById("btnRow");

    // Kesişimden kaçınacak şekilde random pozisyon:
    function randomizeButtonPosition(avoidRects) {
      hayirBtn.style.position = "fixed";
      hayirBtn.style.margin = 0;
      const pad = 10;
      const w = window.innerWidth - hayirBtn.offsetWidth - pad;
      const h = window.innerHeight - hayirBtn.offsetHeight - pad;

      let maxTry = 60;
      let found = false, left, top, btnRect;

      do {
        left = Math.random() * w;
        top = Math.random() * (h - 70) + 35;
        btnRect = {
          left, top,
          right: left + hayirBtn.offsetWidth,
          bottom: top + hayirBtn.offsetHeight
        };
        found = true;
        for (let rect of avoidRects) {
          // Buton ve rect arasında çakışma varsa (biraz pay bırakarak)
          if (!(btnRect.right < rect.left || btnRect.left > rect.right ||
                btnRect.bottom < rect.top || btnRect.top > rect.bottom)) {
            found = false;
            break;
          }
        }
        maxTry--;
      } while (!found && maxTry > 0);

      hayirBtn.style.left = left + "px";
      hayirBtn.style.top = top + "px";
      hayirBtn.style.zIndex = 4;
    }

    function resetButtonPosition() {
      hayirBtn.style.position = "";
      hayirBtn.style.left = "";
      hayirBtn.style.top = "";
      hayirBtn.style.zIndex = "";
      hayirBtn.style.margin = "";
    }

    function noClicked() {
      noCount++;
      textIndex = (textIndex + 1) % questionTexts.length;
      questionEl.textContent = questionTexts[textIndex];

      if (noCount >= maxNo) {
        hayirBtn.textContent = "Evet";
        hayirBtn.onclick = yesClicked;
        // Evet butonuna da random pozisyon ver
        setTimeout(() => {
          placeNoBtnRandomNoOverlap(true);
        }, 100);
        questionEl.textContent = "Pes ediyorum, ne desen haklısın. Affettin mi?";
        return;
      }
      // Yeni pozisyonda çakışma olmasın
      placeNoBtnRandomNoOverlap(false);
      questionEl.style.transform = 'scale(1.05) rotate(-2deg)';
      setTimeout(() => { questionEl.style.transform = ''; }, 110);
    }

    // Buton ve yazı-evet çakışmasın
    function placeNoBtnRandomNoOverlap(isFinal) {
      // Yazı kutusu ve evet butonunun pozisyonunu al
      let questionRect = questionEl.getBoundingClientRect();
      let evetRect = evetBtn.getBoundingClientRect();
      // Finalde evet butonunu da random yerlere kaçır
      if (isFinal) {
        // Evetleri aynı anda ekranda bırakmak istemiyorsan,
        // sadece hayır olanı random bırak (ama çakışmasın)
        // Hayır (artık evet) için rastgele
        randomizeButtonPosition([
          questionRect,
          // Not: Diğer evet butonunu gizlemeden random bırakırız, çakışmasın diye
          { left: evetRect.left - 10, right: evetRect.right + 10, top: evetRect.top - 10, bottom: evetRect.bottom + 10 }
        ]);
      } else {
        randomizeButtonPosition([
          questionRect,
          { left: evetRect.left - 10, right: evetRect.right + 10, top: evetRect.top - 10, bottom: evetRect.bottom + 10 }
        ]);
      }
    }

    function yesClicked() {
      questionEl.textContent = "";
      btnRow.classList.add('hidden');
      gifBox.classList.remove('hidden');
    }

    // İlk açılışta hayır butonu random başlamasın diye burada elleme.
    // Her tıklamada pozisyonu ayarla.
    window.onresize = function () {
      if (hayirBtn.style.position === "fixed") placeNoBtnRandomNoOverlap(noCount >= maxNo);
    };
    // Mobilde yanlışlıkla kaydırmayı önle
    document.body.addEventListener('touchmove', function(e){ if (hayirBtn.style.position==="fixed") e.preventDefault(); }, { passive: false });
  </script>
